
services:
  app:
    build: .
    container_name: my-counter-container
    ports:
      - "${APP_PORT:-8000}:8000"
    environment:
      STORAGE: redis
      REDIS_URL: redis://redis:6379/0
      DATA_FILE: /data/counter.db
      GREETING: "${GREETING:-Default greeting}"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=2)"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
volumes:
  redis-data:
